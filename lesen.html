<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wolfsmond</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wolfsmond">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b10;
  --bg2: #15131c;
  --card: #1c1a25;
  --line: #2a2735;
  --text: #f1eef6;
  --muted: #9a95a8;
  --accent: #e8b44f;
  --accent2: #c2344d;
  --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.view { padding-bottom: calc(80px + var(--safe-b)); min-height: var(--vh100, 100vh); }

/* ---------- Kopf & Tabbar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: linear-gradient(var(--bg) 70%, transparent);
  padding: calc(12px + var(--safe-t)) 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
.brand svg { width: 28px; height: 28px; }
.acct { position: absolute; right: 16px; top: calc(16px + var(--safe-t)); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.acct button { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.top .wrap { position: relative; }
.loading { min-height: 60vh; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.dedication { color: var(--muted); font-size: 13px; margin-top: 2px; font-style: italic; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(15,14,20,.96);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding: 6px 0 calc(6px + var(--safe-b)); }
.tabbar a { flex: 0 1 160px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; }
.tabbar a.on { color: var(--text); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar .tbx { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; margin-left: 4px; padding-left: 6px; border-left: 1px solid var(--line); }
.tabbar .tbx a { flex: 0 0 auto; width: 34px; padding: 6px 0; font-size: 17px; opacity: .55; }
.tabbar .tbx a.on { opacity: 1; }

/* ---------- Startseite ---------- */
.hero { position: relative; border-radius: 18px; overflow: hidden; margin: 6px 0 26px; min-height: 360px; display: flex; align-items: flex-end; }
.hero .bgart { position: absolute; inset: 0; }
.hero .bgart svg { width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 25%, rgba(8,7,11,.55) 55%, rgba(8,7,11,.97)); }
.hero .in { position: relative; z-index: 1; padding: 20px; width: 100%; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #1a1206; background: var(--accent); padding: 3px 8px; border-radius: 6px; }
.hero h2 { font-family: "Cormorant Garamond", serif; font-size: 40px; line-height: 1; margin: 10px 0 6px; }
.hero p { color: #d9d4e2; margin: 0 0 14px; max-width: 460px; }
.intro { margin: 6px 0 26px; display: flow-root; }
.intro h2 { font-family: "Cormorant Garamond", serif; font-size: 30px; line-height: 1.05; margin: 4px 0 8px; color: var(--accent); }
.intro p { color: #d9d4e2; margin: 0 0 10px; line-height: 1.5; font-size: 14.5px; }
.intro p:last-child { margin-bottom: 0; }
.intro .introimg { display: block; float: right; width: 40%; max-width: 240px; margin: 4px 0 8px 14px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.45); }
.intro .introimg img { display: block; width: 100%; height: auto; aspect-ratio: 848/1264; object-fit: cover; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #1a1206; font-weight: 600; padding: 12px 20px; border-radius: 999px; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); }
.btn.wide { width: 100%; }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 12px; }
.sec h3 { font-size: 18px; margin: 0; }
.sec span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 0 -16px 22px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row .tile { flex: 0 0 132px; scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px 12px; margin-bottom: 26px; }
.tile .cover { position: relative; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: var(--card); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.tile .cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile .ct { position: absolute; left: 10px; right: 10px; bottom: 10px; font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 21px; line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.tile .lock { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; background: rgba(0,0,0,.55); color: #ddd; padding: 3px 7px; border-radius: 6px; }
.tile .tm { margin-top: 7px; font-size: 13px; font-weight: 600; }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile.soon .cover { opacity: .78; }
.pbar { height: 3px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.pbar i { display: block; height: 100%; background: var(--accent); }

/* ---------- Bibliothek ---------- */
.libitem { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.libitem .tile { flex: 0 0 132px; width: 132px; }
.libitem .tile .tm, .libitem .tile .ts, .libitem .tile .pbar { display: none; }
.libitem .info { flex: 1; min-width: 0; }
.libitem .info b { display: block; font-size: 16px; }
.libitem .info small { color: var(--muted); }

/* ---------- Detailseite ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 6px 0; font-size: 14px; }
.back svg { width: 20px; height: 20px; }
.dhead { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 18px; }
.dhead .tile { width: 170px; }
.dhead h1 { font-family: "Cormorant Garamond", serif; font-size: 38px; margin: 16px 0 4px; line-height: 1; }
.dhead .tag { color: #d9d4e2; margin: 0 0 12px; }
.stats { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.chip.g { border-color: rgba(232,180,79,.55); color: var(--accent); }
.chip.p { border-color: rgba(194,52,77,.55); color: #f0a3b1; display: none; }
body.showp .chip.p { display: inline-block; }
.chip.ptoggle { cursor: pointer; border-style: dashed; border-color: rgba(194,52,77,.45); color: var(--muted); background: transparent; }
.chip.ptoggle .aus, body.showp .chip.ptoggle .an { display: none; }
body.showp .chip.ptoggle .aus { display: inline; }
.tools .gsel { flex-basis: 100%; }
.tools .qsel { flex-basis: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; min-width: 0; -webkit-appearance: none; appearance: none; }
.acard.locked .aimg img, .adetail.locked img { filter: blur(7px) brightness(.35) grayscale(.4); }
.acard.locked b { letter-spacing: 2px; }
.gh { display: flex; justify-content: space-between; align-items: baseline; font-family: "Cormorant Garamond", serif; font-size: 22px; color: var(--accent); margin: 18px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.gh span { font-family: Inter, sans-serif; font-size: 12px; color: var(--muted); }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: #d9d4e2; }
.desc { color: #d6d1df; line-height: 1.6; margin: 4px 0 22px; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.more { color: var(--accent); font-weight: 600; font-size: 14px; margin-top: -14px; margin-bottom: 20px; display: inline-block; }
.chlist { list-style: none; padding: 0; margin: 0 0 20px; }
.chlist li a { display: flex; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.chlist .no { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.chlist .done .no { background: rgba(232,180,79,.16); color: var(--accent); }
.chlist .cur .no { background: var(--accent); color: #1a1206; }
.chlist .nm { flex: 1; min-width: 0; }
.chlist .nm b { display: block; font-weight: 500; }
.chlist .nm small { color: var(--muted); font-size: 12px; }

/* ---------- Leseansicht ---------- */
body.reading .tabbar { display: none; }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
/* Leseansicht wie Galatea (seit 27.10.2026): oben ☰ Aa · Titel + Kapitel · VIP ✕, gelber Balken; unten „Kapitel X von Y: Name“ + Prozent */
.rbar { position: fixed; left: 0; right: 0; top: 0; z-index: 40; background: var(--rbg); color: var(--rfg);
  border-bottom: 1px solid rgba(127,127,127,.18); padding: calc(6px + var(--safe-t)) 6px 6px; display: flex; align-items: center; gap: 2px; transition: transform .25s; }
.rbar.hide { transform: translateY(-110%); }
.rbar .t { flex: 1; min-width: 0; text-align: center; line-height: 1.25; }
.rbar .t b, .rbar .t small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbar .t b { font-size: 14px; font-weight: 600; }
.rbar .t small { font-size: 12px; color: var(--rmut); }
.rbar button, .rbar a { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: inherit; flex: none; }
.rbar svg { width: 22px; height: 22px; }
/* VIP Zugang wie bei Galatea (seit 27.10.2026): rundes Symbol am linken Rand, Mitte auf ~80 % Höhe, mind. 12 px über der Fußzeile, Schildchen darunter, beim Scrollen leicht durchsichtig */
.vipf { position: fixed; left: 4px; top: min(calc(80% - 29px), calc(100% - 100px - var(--safe-b))); z-index: 38; display: grid; justify-items: center; gap: 2px; transition: opacity .35s; -webkit-tap-highlight-color: transparent; }
.vipf .vr { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #2a2232, #0f0d14); border: 1.5px solid #e8b44f; box-shadow: 0 3px 12px rgba(0,0,0,.55), 0 0 10px rgba(232,180,79,.25); --rbg: #0f0d14; }
.vipf .vr svg { width: 26px; height: 26px; }
.vipf .vs { font: 700 7.5px/1 Inter, sans-serif; letter-spacing: .4px; text-transform: uppercase; color: #fff; background: #c2185b; border-radius: 4px; padding: 3px 4px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.vipf.still { opacity: .4; }
.rprog { position: fixed; left: 0; top: 0; height: 3px; background: #f2c230; z-index: 41; width: 0; }
.rfuss { position: fixed; left: 0; right: 0; bottom: 0; z-index: 39; display: flex; gap: 10px; justify-content: space-between; align-items: baseline;
  padding: 7px 16px calc(7px + var(--safe-b)); background: var(--rbg); color: var(--rmut); font: 12px/1.3 Inter, sans-serif; border-top: 1px solid rgba(127,127,127,.12); }
.rfuss span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhell { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 38; opacity: 0; }
.kdr { position: fixed; top: 0; bottom: 0; left: 0; z-index: 61; width: min(330px, 86vw); background: var(--bg2); transform: translateX(-102%); transition: transform .25s;
  overflow-y: auto; padding: calc(14px + var(--safe-t)) 0 calc(14px + var(--safe-b)); box-shadow: 4px 0 24px rgba(0,0,0,.35); }
.kdr.open { transform: none; }
.kdr h4 { margin: 4px 18px 10px; font-size: 13px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.kdr a { display: flex; gap: 10px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 15px; }
.kdr a.zu, .chlist li.zu > span { opacity: .5; }
.chlist li.zu > span { display: flex; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.btn.zu { opacity: .6; pointer-events: none; }
.kdr a b { flex: 1; font-weight: 500; }
.kdr a i { font-style: normal; color: var(--accent); width: 16px; text-align: center; }
.kdr a.cur { background: rgba(232,180,79,.13); }
.kdr a.cur b { font-weight: 700; color: var(--accent); }
.reader { --fs: 19px; --ff: Literata, Georgia, serif; --rbg: #0f0e13; --rfg: #e9e5ef; --rmut: #8f8a9c;
  background: var(--rbg); color: var(--rfg); min-height: var(--vh100, 100vh); padding: calc(78px + var(--safe-t)) 0 calc(64px + var(--safe-b)); }
.reader[data-theme="sepia"] { --rbg: #f3e9d7; --rfg: #3b2f22; --rmut: #8a7a64; }
.reader[data-theme="hell"] { --rbg: #fbfaf8; --rfg: #1d1b21; --rmut: #7c7784; }
.reader[data-theme="mint"] { --rbg: #dcefe5; --rfg: #1c2b24; --rmut: #5b7468; }
.reader[data-font="sans"] { --ff: Inter, system-ui, sans-serif; }
.reader[data-font="bookish"] { --ff: "Cormorant Garamond", Georgia, serif; }
.reader[data-font="bookish"] .txt { font-size: calc(var(--fs) * 1.1); }
.seg .sw.rund { width: 34px; height: 34px; border-radius: 50%; display: block; margin: 0 auto; border: 1px solid rgba(127,127,127,.4); }
.seg button.rund { padding: 8px 0; }
.rsl { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.rsl input { flex: 1; accent-color: var(--accent); }
.rsl small { font-size: 13px; color: var(--muted); }
.reader .wrap { max-width: 680px; padding: 0 22px; }
.reader .kick { text-align: center; color: var(--rmut); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
.reader h1 { text-align: center; font-family: "Cormorant Garamond", serif; font-size: calc(var(--fs) * 1.9); line-height: 1.05; margin: 0 0 34px; }
.reader .txt { font-family: var(--ff); font-size: var(--fs); line-height: var(--lh, 1.72); }
.reader .txt p { margin: 0 0 1.05em; hyphens: auto; -webkit-hyphens: auto; }
.reader .txt .br { text-align: center; color: var(--rmut); letter-spacing: .6em; margin: 1.6em 0; }
.reader .txt .quote { border-left: 3px solid var(--accent); padding: .3em 0 .3em 1em; margin: 1.3em 0; font-size: .92em; color: var(--rfg); opacity: .92; }
.reader .txt .quote p { margin-bottom: .7em; }
.reader .txt .msg { margin: 1em 0 1.1em; max-width: 88%; background: rgba(127,127,127,.14); border-radius: 16px 16px 16px 4px; padding: .6em .85em .5em; font-size: .9em; }
.reader .txt .msg .mh { display: flex; justify-content: space-between; gap: 12px; font-size: .78em; color: var(--rmut); margin-bottom: .2em; font-family: Inter, sans-serif; }
.reader .txt .msg .mh b { color: var(--accent2); }
.reader[data-theme="dunkel"] .txt .msg .mh b { color: #ef7d92; }
.rend { margin: 40px 0 10px; text-align: center; }
.rend .of { color: var(--rmut); font-size: 13px; margin-bottom: 14px; }
.rnav { display: flex; gap: 10px; }
.rnav .btn { flex: 1; }
.reader[data-theme="sepia"] .btn.ghost, .reader[data-theme="hell"] .btn.ghost { background: rgba(0,0,0,.07); color: var(--rfg); }

/* ---------- Sammelkarten „VIP Zugang“ (seit 27.10.2026): Holo beim Neigen, Antippen dreht um ---------- */
.vipov { position: fixed; inset: 0; z-index: 70; background: radial-gradient(circle at 50% 30%, #2b1e12, #07060a 72%); overflow-y: auto;
  padding: calc(54px + var(--safe-t)) 16px calc(30px + var(--safe-b)); display: none; -webkit-tap-highlight-color: transparent; }
.vipov.open { display: block; animation: vipIn .35s ease; }
@keyframes vipIn { from { opacity: 0; } }
.vipov .zu { position: fixed; top: calc(10px + var(--safe-t)); right: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 20px; z-index: 2; }
.vipov .hint { text-align: center; color: rgba(255,255,255,.55); font-size: 12px; margin-top: 14px; }
.vk { --g1: #f7e08a; --g2: #c9962c; --g3: #8a5f12; --ink: #2a1d0b; --pap: #f8efd9; --pap2: #ead9b0; --akz: #9a6b12;
  width: min(360px, 100%); margin: 0 auto; perspective: 1400px; }
.vk[data-r="silber"] { --g1: #f2f5f8; --g2: #a9b2bc; --g3: #5c6670; --ink: #1d2329; --pap: #eef1f4; --pap2: #d3d9df; --akz: #4b5866; }
.vk .in { position: relative; transition: transform .7s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.vk.um .in { transform: rotateX(var(--rx, 0deg)) rotateY(calc(180deg + var(--ry, 0deg))); }
.vk .vs, .vk .rs { border-radius: 18px; padding: 10px; background: linear-gradient(135deg, var(--g1), var(--g2) 40%, var(--g3) 70%, var(--g2)); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.3); }
.vk .rs { position: absolute; inset: 0; transform: rotateY(180deg); display: grid; place-items: center; }
.vk .body { position: relative; border-radius: 10px; background: linear-gradient(170deg, var(--pap), var(--pap2)); color: var(--ink); padding: 10px 12px 12px; overflow: hidden; }
.vk .kopf { display: flex; align-items: center; gap: 8px; }
.vk .kopf h2 { flex: 1; margin: 0; font: 700 22px/1.1 "Cormorant Garamond", Georgia, serif; }
.vk .kopf .hz { font: 700 12px Inter, sans-serif; color: #b3122e; white-space: nowrap; }
.vk .kopf .hz b { font-size: 20px; }
.vk .kopf svg { width: 30px; height: 30px; flex: none; }
.vk .typ { font: 600 10.5px Inter, sans-serif; letter-spacing: .8px; text-transform: uppercase; color: var(--akz); margin: 1px 0 6px; }
.vk .bild { position: relative; border: 4px solid; border-image: linear-gradient(135deg, var(--g1), var(--g3), var(--g1)) 1; aspect-ratio: 4 / 3; overflow: hidden; background: #000; }
.vk .bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vk .bild .eck { position: absolute; width: 26px; height: 26px; opacity: .9; }
.vk .unter { text-align: center; font: italic 12.5px Literata, Georgia, serif; color: var(--akz); margin: 6px 0 8px; }
.vk .wt { display: grid; grid-template-columns: auto 1fr 28px; align-items: center; gap: 3px 8px; font: 12px Inter, sans-serif; margin-bottom: 8px; }
.vk .wt .pk { display: flex; gap: 3px; position: relative; min-width: 0; }
.vk .wt .pk i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--g3); flex: none; }
.vk .wt .pk i.v { background: radial-gradient(circle at 35% 35%, var(--g1), var(--g2) 60%, var(--g3)); }
.vk .wt .pk i.x { background: radial-gradient(circle at 35% 35%, #ff9aa8, #d4143a 60%, #7d0a1f); border-color: #7d0a1f; position: absolute; top: 0; animation: vipX 1.1s ease-in-out infinite alternate; box-shadow: 0 0 6px rgba(212,20,58,.7); }
@keyframes vipX { from { transform: translateY(0) scale(1); } to { transform: translateY(-2px) scale(1.18); } }
.vk .wt .zahl { font-weight: 700; text-align: right; position: relative; z-index: 2; }
.vk .wt .zahl.ueber { color: #fff; background: #d4143a; border-radius: 9px; padding: 0 4px; text-align: center; animation: vipBlink .9s steps(2) infinite; }
@keyframes vipBlink { 50% { opacity: .35; } }
.vk .wt small { grid-column: 1 / -1; margin: -3px 0 2px; font-style: italic; color: var(--akz); font-size: 10.5px; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  const app = document.getElementById("app");
  const SBC = JSON.parse(document.getElementById("sbcfg").textContent);
  let DATA = JSON.parse(document.getElementById("data").textContent);   // nur in der lokalen Vorschau eingebettet
  let sb = null, user = null, metaText = "";
  const fail = msg => { app.innerHTML = `<div class="loading"><div>${msg}<br><br><a class="btn" href="index.html">Zur Anmeldung</a></div></div>`; };
  if (!DATA) {
    app.innerHTML = '<div class="loading">Lädt …</div>';
    try {
      sb = supabase.createClient(SBC.url, SBC.key);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace("index.html" + location.hash); return; }   // Ziel (z. B. #fragebogen) nach der Anmeldung beibehalten
      user = session.user;
      const r = await sb.storage.from(SBC.bucket).download("meta.json");
      if (r.error) throw r.error;
      metaText = await r.data.text();
      DATA = JSON.parse(metaText);
      // Datierte Bände (seit 27.10.2026): der Server liefert sie erst ab ihrem Tag (Markus: immer); Texte erst beim Lesen
      try {
        const d = await sb.from("datiert").select("id, ab, meta");
        (d.data || []).forEach(x => { if (!DATA.stories.some(s => s.id === x.id)) DATA.stories.push(Object.assign(x.meta, { datiert: true, ab: x.ab })); });
        // Kapitel mit eigenem Datum (seit 28.10.2026, Adventskrimi 1903): Titel + Text kommen erst ab ihrem Tag (Markus: sofort)
        if (DATA.stories.some(s => s.kapAb)) {
          const k = await sb.from("datiert_kapitel").select("id, nr, titel, blocks");
          (k.data || []).forEach(x => { const c = ((DATA.stories.find(s => s.id === x.id) || {}).chapters || [])[x.nr]; if (c) { c.title = x.titel; c.blocks = x.blocks; } });
        }
      } catch (e) {}
    } catch (e) { return fail("Die Bibliothek konnte nicht geladen werden."); }
  }
  /* Archiv (seit 20.10.2026), pro Konto steuerbar – stories.json → app.archiv:
     {offen: [Band-IDs im Hauptbereich], konten: {"markus": {archivSehen: true, offen: [...] | "alle"}}}
     Nicht offene Bände sind archiviert: Konten mit archivSehen finden sie im Bereich „Archiv“, alle anderen sehen sie gar nicht.
     Ein Konto ohne Eintrag nutzt die allgemeine offen-Liste. Lesestand/Feedback archivierter Bände bleiben erhalten. */
  const ARC = DATA.app.archiv || null;
  const konto = user ? (user.email || "").split("@")[0].toLowerCase() : "";
  const KC = ARC ? ((ARC.konten || {})[konto] || {}) : {};
  const OFFEN = KC.offen || (ARC && ARC.offen) || "alle";
  const archivSicht = !ARC || !user || !!KC.archivSehen;                 // lokale Vorschau: alles
  const isArch = s => !!ARC && OFFEN !== "alle" && !OFFEN.includes(s.id) && !s.datiert;   // datierte Bände stehen nach Freischaltung immer vorn
  const ALLE = DATA.stories.filter(s => archivSicht || !isArch(s));      // alles, was dieses Konto überhaupt sehen darf
  const STORIES = ALLE.filter(s => !isArch(s));                          // Hauptbereich
  const ARCHIV = ALLE.filter(isArch);                                    // nur für Konten mit Archiv
  const byId = Object.fromEntries(ALLE.map(s => [s.id, s]));
  /* Brief „Für meine Herrin“ (seit 20.10.2026): stories.json → app.brief = {fuer: [Konten, die statt des Fragebogens den Brief sehen], leser: [Konten, die die Antworten sehen]} */
  const BC = DATA.app.brief || {};
  /* Feedbackbogen (seit 20.10.2026): stories.json → app.feedback = {ab: 1001, leser: [...], fragen: [...]} – für Bände ab „ab“ und alle nicht archivierten */
  const FBC = DATA.app.feedback || null;
  const fbbFuer = st => !!FBC && st.status === "fertig" && ((st.nr || 0) >= FBC.ab || (!isArch(st) && (st.nr || 0) < 9000));
  const KFC = DATA.app.kapitelfeedback || null;
  const kfbFuer = st => !!KFC && (KFC.baende || []).includes(st.nr);
  const kfbLeser = !!user && !!KFC && (KFC.leser || []).includes(konto);
  const fbbLeser = !!user && !!FBC && (FBC.leser || []).includes(konto);
  const briefFuer = !!user && (BC.fuer || []).includes(konto), briefLeser = !!user && (BC.leser || []).includes(konto);
  const userName = user ? (user.user_metadata && user.user_metadata.name) || user.email.split("@")[0].replace(/^./, c => c.toUpperCase()) : "";

  /* ---------- Speicher (nur Bequemlichkeit, darf fehlen) ---------- */
  const mem = {};
  const PFX = "wm." + (user ? user.id.slice(0, 8) + "." : "");
  function load(k, d) { try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : d; } catch (e) { return k in mem ? mem[k] : d; } }
  function save(k, v) {
    if (k === "prefs") v.t = Date.now();
    mem[k] = v; try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {}
    if (k === "progress" || k === "prefs" || k === "removed" || k === "ach" || k === "log" || k === "fb" || k === "fragen" || k === "brief" || k === "neuig" || k === "fbb" || k === "kfb") pushSoon();
  }
  let progress = load("progress", {});   // {id: {ch, pos, read:[...], t, done, start, again, re, last}}
  let prefs = load("prefs", { fs: 19, theme: "dunkel", font: "serif" });
  let removed = load("removed", {});     // {id: Zeitpunkt des Zurücksetzens} – damit andere Geräte es mitbekommen
  let ach = load("ach", {});             // {achievementId: Zeitpunkt, _init: erste Prüfung, "!id": angezeigt} – einmal verdient, bleibt verdient
  let fb = load("fb", {});               // Rückmeldung am Buchende {id: {like, fortsetzung, kommentar, geaendert_am}} – seit 15.10.2026
  let log = load("log", {});
  let fragen = load("fragen", { a: {} });
  let brief = load("brief", { a: {} });
  let neuig = load("neuig", { a: {} });    // Antworten auf den Text „Neuigkeiten“ (ersetzt den Brief in der App) – seit 21.10.2026
  let fbb = load("fbb", {});
  let kfb = load("kfb", {});               // Kurzfeedback je Kapitel {"buchId/kapitelIndex": {a: {frageId: {v, t}}}} – seit 21.10.2026               // Feedbackbogen je Buch {id: {a: {frageId: {v, t}}, sent}} – seit 20.10.2026    // Antworten im Brief „Für meine Herrin“ {a: {id: {v, t}}, sent} – seit 20.10.2026  // Fragebogen-Antworten {a: {frageId: {v, t}}, sent} – seit 20.10.2026, wird beim Hochladen mit dem Server zusammengeführt             // Lesetagebuch {"JJJJ-MM-TT": {n: gelesene Kapitel, h: [Stunden]}} – seit 13.10.2026

  /* ---------- Abgleich mit Supabase (Tabelle progress, eine Zeile pro Benutzer) ---------- */
  let pushT = 0;
  function pushSoon() { if (!sb) return; clearTimeout(pushT); pushT = setTimeout(pushNow, 1200); }
  /* Ereignisse für Markus' Neuigkeiten/Push (seit 21.10.2026): nur aus anderen Konten; offline in einer Warteschlange */
  const istAdmin = !!user && (user.email || "").toLowerCase() === "markus@wolfsmond.app";
  /* Titelbild nach Anlass (seit 23.10.2026): app.anlaesse, Reihenfolge = Vorrang; von/bis „MM-TT“ (ohne bis = ein Tag),
     ostern: [Tage vor, Tage nach] Ostersonntag (Gauß/Meeus). t = {y, m, d} in Europe/Berlin. */
  function anlassHeute(list, t) {
    const md = String(t.m).padStart(2, "0") + "-" + String(t.d).padStart(2, "0");
    const ostern = j => { const a = j % 19, b = Math.floor(j / 100), c = j % 100, h = (19 * a + b - Math.floor(b / 4) - Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3) + 15) % 30,
      l = (32 + 2 * (b % 4) + 2 * Math.floor(c / 4) - h - c % 4) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), x = h + l - 7 * m + 114;
      return Date.UTC(j, Math.floor(x / 31) - 1, x % 31 + 1); };
    const diff = (Date.UTC(t.y, t.m - 1, t.d) - ostern(t.y)) / 864e5;
    return (list || []).find(a => a.ostern ? diff >= a.ostern[0] && diff <= a.ostern[1] : a.von && (a.bis && a.bis < a.von ? md >= a.von || md <= a.bis : md >= a.von && md <= (a.bis || a.von))) || null;
  }
  /* Heute in Berlin; ?datum=JJJJ-MM-TT simuliert ein Datum (nur wo erlaubt) */
  function heuteBerlin(simErlaubt) {
    const sim = simErlaubt && /^(\d{4})-(\d{2})-(\d{2})$/.exec(new URLSearchParams(location.search).get("datum") || "");
    if (sim) return { y: +sim[1], m: +sim[2], d: +sim[3], sim: true };
    try { const p = Object.fromEntries(new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", year: "numeric", month: "numeric", day: "numeric" }).formatToParts(new Date()).map(x => [x.type, x.value])); return { y: +p.year, m: +p.month, d: +p.day }; }
    catch (e) { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }; }
  }
  const HEUTE = heuteBerlin(istAdmin || !sb);          // Datum simulieren: nur Markus und die lokale Vorschau
  const isoTag = t => `${t.y}-${String(t.m).padStart(2, "0")}-${String(t.d).padStart(2, "0")}`;
  /* Kapitel noch gesperrt (eigenes „ab“): Text fehlt (Server liefert ihn erst ab dem Tag) oder simuliertes Datum liegt davor */
  const kapZu = (st, i) => { const c = st && st.chapters && st.chapters[i]; return !!(c && c.ab && (!c.blocks || (HEUTE.sim && c.ab > isoTag(HEUTE)))); };
  const kapAbText = c => { const [, m, d] = c.ab.split("-"); return "ab " + +d + ". " + ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"][+m - 1]; };
  let evq = load("evq", []);
  function ereignis(art, text, ref) {
    if (!sb || istAdmin) return;
    evq.push({ art, text, ref: ref || {} }); save("evq", evq);
    evFlush();
  }
  async function evFlush() {
    if (!sb || !evq.length || !navigator.onLine) return;
    const jetzt = evq.slice();
    try {
      const { error } = await sb.from("ereignisse").insert(jetzt);
      if (!error) { evq = evq.slice(jetzt.length); save("evq", evq); }
    } catch (e) {}
  }

  /* Fragebogen-Antworten: pro Frage gewinnt der neuere Zeitstempel – so überschreibt ein anderes Gerät mit altem Stand nie Antworten. */
  function mergeAnt(ziel, r) {
    let changed = false;
    if (!r || !r.a) return false;
    Object.entries(r.a).forEach(([id, x]) => { const l = ziel.a[id]; if (!l || (x.t || 0) > (l.t || 0)) { ziel.a[id] = x; changed = true; } });
    // Ausgaben (seit 27.10.2026, Neuigkeiten): neuere Ausgabe gewinnt, innerhalb einer Ausgabe wie bisher
    const ra = r.sentAusgabe || 1, za = ziel.sentAusgabe || 1;
    if (ra > za || (ra === za && (r.sent || 0) > (ziel.sent || 0))) { ziel.sent = r.sent; if (r.sentAusgabe) ziel.sentAusgabe = r.sentAusgabe; changed = true; }
    const rg = r.gelesenAusgabe || 1, zg = ziel.gelesenAusgabe || 1;
    if (r.gelesen && (rg > zg || (rg === zg && (!ziel.gelesen || r.gelesen < ziel.gelesen)))) { ziel.gelesen = r.gelesen; if (r.gelesenAusgabe) ziel.gelesenAusgabe = r.gelesenAusgabe; changed = true; }   // Brief: erstes Öffnen
    return changed;
  }
  const mergeFragen = r => mergeAnt(fragen, r);
  function mergeFbb(r, ziel) {
    ziel = ziel || fbb;
    let changed = false;
    Object.entries(r || {}).forEach(([id, x]) => { if (mergeAnt(ziel[id] || (ziel[id] = { a: {} }), x)) changed = true; });
    return changed;
  }
  async function pushNow() {
    if (!sb) return false;
    clearTimeout(pushT);
    try {
      const rf = await sb.from("progress").select("fragen:data->fragen,brief:data->brief,neuig:data->neuig,fbb:data->fbb,kfb:data->kfb").eq("user_id", user.id).maybeSingle();
      if (rf.error) return false;                       // ohne Serverstand nicht schreiben (Antworten schützen)
      if (rf.data && mergeFragen(rf.data.fragen)) { mem.fragen = fragen; try { localStorage.setItem(PFX + "fragen", JSON.stringify(fragen)); } catch (e) {} }
      if (rf.data && mergeAnt(brief, rf.data.brief)) { mem.brief = brief; try { localStorage.setItem(PFX + "brief", JSON.stringify(brief)); } catch (e) {} }
      if (rf.data && mergeAnt(neuig, rf.data.neuig)) { mem.neuig = neuig; try { localStorage.setItem(PFX + "neuig", JSON.stringify(neuig)); } catch (e) {} }
      if (rf.data && mergeFbb(rf.data.fbb)) { mem.fbb = fbb; try { localStorage.setItem(PFX + "fbb", JSON.stringify(fbb)); } catch (e) {} }
      if (rf.data && mergeFbb(rf.data.kfb, kfb)) { mem.kfb = kfb; try { localStorage.setItem(PFX + "kfb", JSON.stringify(kfb)); } catch (e) {} }
      const { error } = await sb.from("progress").upsert({ user_id: user.id, data: { progress, prefs, removed, ach, log, fb, fragen, brief, neuig, fbb, kfb }, updated_at: new Date().toISOString() });
      evFlush();
      return !error;
    } catch (e) { return false; }
  }
  async function pull() {
    if (!sb) return false;
    let changed = false;
    try {
      const { data, error } = await sb.from("progress").select("data").eq("user_id", user.id).maybeSingle();
      if (error || !data || !data.data) return false;
      const r = data.data;
      Object.entries(r.removed || {}).forEach(([id, t]) => {
        if ((removed[id] || 0) < t) removed[id] = t;
        if (progress[id] && (progress[id].t || 0) < t) { delete progress[id]; changed = true; }
      });
      Object.entries(r.progress || {}).forEach(([id, p]) => {
        if ((removed[id] || 0) >= (p.t || 0)) return;
        const l = progress[id];
        if (!l || (p.t || 0) > (l.t || 0)) { progress[id] = p; changed = true; }
      });
      if (r.prefs && (r.prefs.t || 0) > (prefs.t || 0)) { prefs = r.prefs; changed = true; }
      Object.entries(r.ach || {}).forEach(([k, t]) => { if (!(k in ach) || t < ach[k]) { ach[k] = t; changed = true; } });
      Object.entries(r.log || {}).forEach(([d, e]) => {
        const l = log[d] || (log[d] = { n: 0, h: [] });
        if ((e.n || 0) > l.n) { l.n = e.n; changed = true; }
        if (e.o && !l.o) { l.o = 1; changed = true; }
        (e.h || []).forEach(x => { if (!l.h.includes(x)) { l.h.push(x); changed = true; } });
      });
      Object.entries(r.fb || {}).forEach(([id, f]) => { if (!fb[id] || (f.geaendert_am || 0) > (fb[id].geaendert_am || 0)) { fb[id] = f; changed = true; } });
      if (mergeFragen(r.fragen)) changed = true;
      if (mergeAnt(brief, r.brief)) changed = true;
      if (mergeAnt(neuig, r.neuig)) changed = true;
      if (mergeFbb(r.fbb)) changed = true;
      if (mergeFbb(r.kfb, kfb)) changed = true;
      mem.progress = progress; mem.prefs = prefs; mem.removed = removed; mem.ach = ach; mem.log = log; mem.fb = fb; mem.fragen = fragen; mem.brief = brief; mem.neuig = neuig; mem.fbb = fbb; mem.kfb = kfb;
      try { localStorage.setItem(PFX + "progress", JSON.stringify(progress)); localStorage.setItem(PFX + "prefs", JSON.stringify(prefs)); localStorage.setItem(PFX + "removed", JSON.stringify(removed)); localStorage.setItem(PFX + "ach", JSON.stringify(ach)); localStorage.setItem(PFX + "log", JSON.stringify(log)); localStorage.setItem(PFX + "fb", JSON.stringify(fb)); localStorage.setItem(PFX + "fragen", JSON.stringify(fragen)); localStorage.setItem(PFX + "brief", JSON.stringify(brief)); localStorage.setItem(PFX + "neuig", JSON.stringify(neuig)); localStorage.setItem(PFX + "fbb", JSON.stringify(fbb)); localStorage.setItem(PFX + "kfb", JSON.stringify(kfb)); } catch (e) {}
    } catch (e) {}
    return changed;
  }
  if (sb) {
    await pull();
    pushSoon();
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "hidden") { kfbFlush(); pushNow(); }
      else {
        if (await pull()) { checkAch(); if (!document.body.classList.contains("reading")) route(); }
        evFlush(); nbZahl(); gsPruefen();
        if (new Date(lastCheck).toDateString() !== new Date().toDateString() || Date.now() - lastCheck > 6 * 3600e3) checkLibrary();
      }
    });
  }

  /* ---------- Bibliothek auf neue Bücher prüfen: täglich um Mitternacht und beim Zurückkehren in die App ---------- */
  let lastCheck = Date.now(), reloadPending = false;
  async function applyUpdate() {
    await pushNow();                       // Fortschritt sichern, dann frisch laden
    location.reload();
  }
  async function checkLibrary() {
    if (!sb || reloadPending) return;
    lastCheck = Date.now();
    try {
      const faellig = DATA.stories.some(s => s.kapAb && s.chapters.some(c => !c.blocks && c.ab <= isoTag(heuteBerlin(false))));   // neues Kapitel freigeschaltet
      const r = faellig ? null : await sb.storage.from(SBC.bucket).download("meta.json");
      if (r && r.error) return;
      const fresh = r && await r.data.text();
      if (r && (!fresh || fresh === metaText)) return;
      reloadPending = true;
      if (!document.body.classList.contains("reading") && document.visibilityState === "visible") return applyUpdate();
      libToast("Neu in der Bibliothek", "Die Bibliothek aktualisiert sich, sobald du das Buch verlässt.");
    } catch (e) {}
  }
  window.addEventListener("hashchange", () => { if (reloadPending && !location.hash.startsWith("#/read")) applyUpdate(); });
  (function midnight() {
    const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 1 + Math.floor(Math.random() * 4));
    setTimeout(() => { checkLibrary(); midnight(); }, next - n);
  })();

  /* ---------- Kapiteltexte nachladen (online liegen sie je Buch in einer eigenen Datei) ---------- */
  async function ensureBlocks(st) {
    if (st.kapAb) return;                  // Kapiteltexte kommen schon beim Start aus datiert_kapitel
    if (st.datiert && !st.chapters.every(c => c.blocks)) {
      const r = await sb.from("datiert").select("texte").eq("id", st.id).single();
      if (r.error) throw r.error;
      st.chapters.forEach((c, i) => { c.blocks = r.data.texte[i] || []; });
      return;
    }
    if (!st.file || st.chapters.every(c => c.blocks)) return;
    const r = await sb.storage.from(SBC.bucket).download(st.file);
    if (r.error) throw r.error;
    const all = JSON.parse(await r.data.text());
    st.chapters.forEach((c, i) => { c.blocks = all[i] || []; });
  }

  /* ---------- Hilfen ---------- */
  function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rnd(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function words(st) { return (st.chapters || []).reduce((a, c) => a + c.words, 0); }
  function readTime(w) { const m = Math.round(w / 230); return m < 90 ? m + " Min." : "ca. " + Math.round(m / 60) + " Std."; }
  function pct(st) { const p = progress[st.id]; if (!p || !st.chapters) return 0; if (p.done && !p.re) return 100; return Math.round(((p.read || []).length / st.chapters.length) * 100); }
  const isDone = st => !!(progress[st.id] && progress[st.id].done);

  function readStats() {

        (st.praktiken || []).forEach(t => { prak[t] = (prak[t] || 0) + 1; });
        (st.tags || []).forEach(t => { tags[t] = (tags[t] || 0) + 1; });

  function achMet(a, s) {
    switch (a.typ) {

      case "praktik-reich": return s.richest >= a.ziel;
      case "straehne": return s.streak >= a.ziel;

  /* ---------- Cover (generiert) ---------- */
  function coverSVG(st, w, h) {
    w = w || 200; h = h || 300;

    const id = "g" + hash(st.id + w);

  function arrange(list) {

      && (!q || [s.title, s.tagline, s.description].some(x => (x || "").toLowerCase().includes(q))));

    else if (so === "genre") l.sort((a, b) => (g !== "alle" ? 0 : genreIdx(a) - genreIdx(b)) || byNr(a, b));
    else if (so === "status") l.sort((a, b) => (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || byNr(a, b));
    else if (so === "zuletzt") l.sort((a, b) => ((progress[b.id] || {}).t || 0) - ((progress[a.id] || {}).t || 0) || byNr(a, b));

        <div class="pbar"><i style="width:${pct(s)}%"></i></div></div></a>`;

    const soon = STORIES.filter(s => s.status === "demnaechst").sort((a, b) => (a.nr || 0) - (b.nr || 0));
    if (soon.length) h += `<div class="sec" style="margin-top:24px"><h3>Demnächst</h3><span>${soon.length}</span></div><div class="row">${soon.map(s => tile(s)).join("")}</div>`;
    return h + "</div>";
  }

  function viewDone() {
    let h = header() + '<div class="wrap"><div class="sec"><h3>Gelesen</h3></div>';
    const list = ALLE.filter(isDone).sort((a, b) => progress[b.id].done - progress[a.id].done);
    if (!list.length) h += '<div class="empty">Noch kein Buch abgeschlossen.<br>Am Ende des letzten Kapitels kannst du ein Buch abschließen – dann erscheint es hier.</div>';
    list.forEach(s => {
      h += `<a class="libitem" href="#/story/${s.id}">${tile(s, "", true)}<div class="info"><b>${esc(s.title)}</b>
        <small>Gelesen am ${fmtDate(progress[s.id].done)} · ${s.chapters.length} Kapitel</small></div></a>`;
    });
    return h + "</div>";
  }

  function viewAch() {
    const s = readStats();
    const got = ACH.filter(a => a.id in ach && a.img && a.kat !== "geheim");
    const geheim = ACH.filter(a => a.kat === "geheim" && a.img);
    let h = header() + `<div class="wrap"><div class="sec"><h3>Errungenschaften</h3><span>${got.length} freigeschaltet</span></div>
      <div class="astats"><div><b>${s.books}</b><small>${s.books === 1 ? "Buch" : "Bücher"} gelesen</small></div>
      <div><b>${fmtHours(s.hours).replace(" Std.", "").replace(" Min.", "")}</b><small>${s.hours < 1 ? "Minuten" : "Stunden"} Lesezeit</small></div>
      <div><b>${Object.keys(s.genres).filter(g => GENRES[g]).length}</b><small>Genres entdeckt</small></div></div>`;
    if (!got.length) h += '<div class="empty">Noch keine Errungenschaften.<br>Lies weiter – die erste wartet schon auf dich.</div>';
    ACH_CATS.forEach(([k, label]) => {
      if (k === "geheim") return;
      let list = got.filter(a => achKat(a) === k);
      if (!list.length) return;
      if (k === "genre" || k === "meister") list.sort((a, b) => (GENRE_KEYS.indexOf(a.genre) - GENRE_KEYS.indexOf(b.genre)) || (a.ziel || 0) - (b.ziel || 0));
      else if (k === "buecher" || k === "zeit") list.sort((a, b) => a.ziel - b.ziel);
      h += `<div class="sec"><h3>${label}</h3><span>${list.length}</span></div>
        <div class="achgrid">${list.map(a => `<button class="acard ${stufeCls(a)}" data-a="${a.id}">
          <div class="aimg">${a.img ? `<img src="${a.img}" alt="" loading="lazy" decoding="async">` : ""}</div>
          <b>${esc(a.titel)}</b><small>${a.typ === "genre" || a.typ === "meister" ? esc(GENRES[a.genre] || "") : fmtDate(ach[a.id])}</small></button>`).join("")}</div>`;
    });
    if (geheim.length) {
      const offen = geheim.filter(a => a.id in ach).length;
      h += `<div class="sec"><h3>Geheim</h3><span>${offen} von ${geheim.length}</span></div>
        <div class="achgrid">${geheim.map(a => { const zu = !(a.id in ach); return `<button class="acard ${zu ? "locked" : stufeCls(a)}" data-a="${a.id}">
          <div class="aimg"><img src="${a.img}" alt="" loading="lazy" decoding="async"></div>
          <b>${zu ? "???" : esc(a.titel)}</b><small>${zu ? "geheim" : fmtDate(ach[a.id])}</small></button>`; }).join("")}</div>`;
    }
    return h + "</div>";
  }

  function viewStory(id) {
    const st = byId[id];
    if (!st) return viewHome();
    const back = `<div class="top"><div class="wrap"><a class="back" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Zurück</a></div></div>`;
    if (st.status === "demnaechst") {
      return back + `<div class="wrap"><div class="dhead">${tile(st)}<h1>${esc(st.title)}</h1>
        <p class="tag">${esc(st.tagline || "Diese Geschichte entsteht gerade.")}</p>
        ${chipsHtml(st)}</div>
        <p class="soonnote">Diese Geschichte entsteht gerade. Sobald die ersten Kapitel fertig sind, erscheinen sie hier.</p>
        ${st.description ? `<p class="desc">${esc(st.description)}</p>` : ""}</div>`;
    }
    const p = progress[st.id] || { ch: -1, read: [] };
    const w = words(st);
    let h = back + `<div class="wrap"><div class="dhead">${tile(st)}<h1>${esc(st.title)}</h1><p class="tag">${esc(st.tagline || "")}</p>
      <div class="stats">${st.chapters.length} Kapitel · ${readTime(w)} Lesezeit · ${st.status === "fertig" ? "Abgeschlossen" : "Laufend"}</div>
      ${chipsHtml(st)}
      ${p.done ? `<div class="donebox">✓ Gelesen am ${fmtDate(p.done)}${p.again ? ` · ${p.again + 1}× gelesen` : ""}</div>` : ""}
      ${p.done && !p.re ? `<a class="btn wide" href="javascript:void 0" id="again">Nochmal lesen</a>`
        : `<a class="btn wide" href="#/read/${st.id}/${Math.max(p.ch, 0)}">${p.ch >= 0 ? "Weiterlesen · Kapitel " + (p.ch + 1) : "Kapitel 1 lesen"}</a>`}
      <div class="dlinks">${p.done ? `<a href="javascript:void 0" id="undone">Wieder als ungelesen markieren</a>`
        : `<a href="javascript:void 0" id="markdone">Als gelesen markieren</a>${p.ch >= 0 ? `<a href="javascript:void 0" id="reset">Fortschritt zurücksetzen</a>` : ""}`}</div></div>
      <p class="desc clamp" id="desc">${esc(st.description || "")}</p><a class="more" href="javascript:void 0" id="more">Mehr anzeigen</a>
      <div class="sec"><h3>Kapitel</h3><span>${st.chapters.length}</span></div><ul class="chlist">`;
    st.chapters.forEach((c, i) => {
      const rd = (p.read || []).includes(i), cur = i === p.ch && !p.done;
      const cls = cur ? "cur" : (rd ? "done" : "");
      if (kapZu(st, i)) { h += `<li class="zu"><span><span class="no">🔒</span><span class="nm"><b>${kapAbText(c)}</b><small>Kapitel ${i + 1}</small></span></span></li>`; return; }
      h += `<li class="${cls}"><a href="#/read/${st.id}/${i}"><span class="no">${rd && !cur ? "✓" : i + 1}</span>
        <span class="nm"><b>${esc(c.title)}</b><small>Kapitel ${i + 1} · ${Math.max(1, Math.round(c.words / 230))} Min.</small></span></a></li>`;
    });
    return h + "</ul></div>";
  }

  function blockHTML(b) {
    if (b.t === "p") return `<p>${b.h}</p>`;
    if (b.t === "br") return `<div class="br">· · ·</div>`;
    if (b.t === "msg") return `<div class="msg"><div class="mh"><b>${b.from}</b><span>${b.time}</span></div>${b.h}</div>`;
    if (b.t === "quote") return `<div class="quote">${b.b.map(blockHTML).join("")}</div>`;
    return "";
  }

  function viewReader(id, ch) {
    const st = byId[id];
    if (!st || !st.chapters) return viewHome();
    ch = Math.min(Math.max(ch, 0), st.chapters.length - 1);
    const c = st.chapters[ch];
    const n = st.chapters.length;
    return `<div class="reader" id="reader" data-theme="${prefs.theme}" data-font="${prefs.font}" style="--fs:${prefs.fs}px;--lh:${prefs.lh || 1.72}">
    <div class="rprog" id="rprog"></div><div class="rhell" id="rhell" style="opacity:${1 - (prefs.hell || 1)}"></div>
    <div class="rbar" id="rbar">
      <button id="kapListe" aria-label="Kapitelübersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="aa" aria-label="Darstellung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19l5-14 5 14M5.8 14h6.4M15 19l3.5-9 3.5 9M16 16.5h5"/></svg></button>
      <div class="t"><b>${esc(st.title)}</b><small>Kapitel ${ch + 1}: ${esc(c.title)}</small></div>
      <a href="#/story/${st.id}" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <button type="button" class="vipf" id="vipBtn" aria-label="VIP Zugang"><span class="vr">${vipIcon}</span><span class="vs">VIP Zugang</span></button>
    <div class="rfuss" id="rfuss"><span>Kapitel ${ch + 1} von ${n}: ${esc(c.title)}</span><span id="rproz">0%</span></div>
      <div class="wrap">
        <div class="kick">Kapitel ${ch + 1}</div><h1>${esc(c.title)}</h1>${buchKarten(st, ch)}
        <div class="txt">${c.blocks.map(blockHTML).join("")}</div>${kfbHTML(st, ch)}
        <div class="rend">${ch === n - 1 && st.status === "fertig" ? `<div class="fin">Ende</div>${fbHTML(st.id)}` : ""}<div class="of">Kapitel ${ch + 1} von ${n}${ch === n - 1 && st.status !== "fertig" ? " · weitere Kapitel folgen" : ""}</div>
          <div class="rnav">
            ${ch > 0 ? `<a class="btn ghost" href="#/read/${st.id}/${ch - 1}">Zurück</a>` : ""}
            ${ch < n - 1 && kapZu(st, ch + 1) ? `<span class="btn ghost zu">Nächstes Kapitel ${kapAbText(st.chapters[ch + 1])}</span>`
              : ch < n - 1 ? `<a class="btn" id="nextch" href="#/read/${st.id}/${ch + 1}">Nächstes Kapitel</a>`
              : (st.status === "fertig" ? `<a class="btn" id="finish" href="#/story/${st.id}">Buch abschließen ✓</a>` : `<a class="btn" id="lastch" href="#/story/${st.id}">Zur Übersicht</a>`)}
          </div></div>
      </div>
    </div>`;
  }

  /* ---------- Fragebogen „Deine Wunschgeschichten“: Fragen liegen privat bei Supabase (fragebogen.json) ---------- */
  let FQ = null, fqT = 0;
  const fqHat = v => Array.isArray(v) ? v.length > 0 : v && typeof v === "object" ? Object.keys(v).length > 0 : !!(v && String(v).trim());
  const fqV = id => (fragen.a[id] || {}).v;
  function fqSet(id, v) { fragen.a[id] = { v, t: Date.now() }; save("fragen", fragen); fqMsg("Gespeichert ✓"); }
  function fqMsg(t) { const m = document.getElementById("fqSave"); if (m) m.textContent = t; }
  function fqAll() { return FQ ? FQ.sections.flatMap(s => s.qs) : []; }
  function fqDone(q) { return fqHat(fqV(q.id)) || (q.txt && fqHat(fqV(q.id + "_text"))); }
  /* Regler 1–10 je Antwort (seit 20.10.2026): Werte unter frageId + "_r" = {Option: 1..10}; unberührt = kein Wert */
  function fqRg(q, i) {
    const o = q.opts[i], r = (fqV(q.id + "_r") || {})[o];
    return `<div class="rgl"><input type="range" min="1" max="10" step="1" value="${r || 5}" class="${r ? "" : "unset"}" data-rq="${q.id}" data-i="${i}" aria-label="Wie sehr: ${esc(o)}"><b>${r || "–"}</b></div>`;
  }
  function fqQ(q) {
    const v = fqV(q.id);
    let h = `<h5>${esc(q.q)}${q.type === "mehrfach" || q.type === "einfach" ? ` <small>(${q.max ? "bis zu " + q.max : "Mehrere Antworten möglich"})</small>` : q.type === "skala" ? " <small>(jede Zeile einzeln)</small>" : ""}</h5>`;
    if (q.type !== "text") h += '<div class="rghelp">Regler: wie sehr / wie oft soll das vorkommen? 1 = kaum · 10 = sehr oft, sehr wichtig</div>';
    if (q.type === "einfach" || q.type === "mehrfach") {
      const sel = Array.isArray(v) ? v : v ? [v] : [];
      h += `<div class="opts rg">${q.opts.map((o, i) => `<div class="optr"><button type="button" data-q="${q.id}" data-i="${i}" class="${sel.includes(o) ? "on" : ""}">${esc(o)}</button>${sel.includes(o) ? fqRg(q, i) : ""}</div>`).join("")}</div>`;
    } else if (q.type === "skala") {
      const m = v || {};
      h += `<div class="sk">${q.opts.map((o, i) => `<div class="skr"><span>${esc(o)}</span><div class="skb">${FQ.scale.map((l, k) => `<button type="button" data-q="${q.id}" data-i="${i}" data-k="${k}" class="s${k} ${m[o] === k ? "on" : ""}">${esc(l)}</button>`).join("")}</div>${m[o] === 3 ? "" : fqRg(q, i)}</div>`).join("")}</div>`;
    }
    if (q.type === "text" || q.txt) {
      const tid = q.type === "text" ? q.id : q.id + "_text";
      h += `<textarea data-t="${tid}" class="${q.big ? "big" : ""}" maxlength="8000" placeholder="${q.type === "text" ? "Schreib, was dir einfällt …" : "Was genau? (optional)"}">${esc(fqV(tid) || "")}</textarea>`;
    }
    return h + '<div class="hint"></div>';
  }
  function fqCount(qs) { return qs.filter(fqDone).length; }
  function viewFragen() {
    let h = header() + '<div class="wrap fq" id="fq">';
    if (!sb) return h + '<div class="empty">Der Fragebogen gibt es nur in der angemeldeten App.</div></div>';
    if (!FQ) return h + '<div class="loading">Fragebogen wird geladen …</div></div>';
    const all = fqAll(), n = fqCount(all);
    h += `<div class="sec"><h3>Deine Wunschgeschichten</h3></div><p class="fqintro">${esc(FQ.intro)}</p>
      <div class="fqprog"><span id="fqN">${n} von ${all.length} Fragen beantwortet</span> · <span class="fqsave" id="fqSave"></span><div class="pbar"><i id="fqBar" style="width:${Math.round(n / all.length * 100)}%"></i></div></div>`;
    FQ.sections.forEach((s, si) => {
      h += `<details data-s="${si}" ${si === 0 || prefs.fqOpen === si ? "open" : ""}><summary>${si + 1}. ${esc(s.title)} <small id="fqS${si}">${fqCount(s.qs)}/${s.qs.length}</small></summary><div class="fqbody">${s.qs.map(q => `<div class="q" id="q_${q.id}">${fqQ(q)}</div>`).join("")}</div></details>`;
    });
    h += `<div class="fqend" id="fqEnd">${fqEnd()}</div></div>`;
    return h;
  }
  function fqEnd() {
    return fragen.sent ? `<div class="fqdank">Danke, Herrin.</div><p>Abgeschickt am ${new Date(fragen.sent).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}. Alles bleibt änderbar – Änderungen speichern sich von selbst.</p><button type="button" class="btn ghost" id="fqSend">Erneut abschicken</button>`
      : `<p>Alles ist freiwillig und speichert sich von selbst. Wenn du fertig bist:</p><button type="button" class="btn" id="fqSend">Abschicken</button>`;
  }
  async function loadFragen() {
    try {
      const r = await sb.storage.from(SBC.bucket).download("fragebogen.json");
      if (r.error) throw r.error;
      FQ = JSON.parse(await r.data.text());
    } catch (e) { FQ = null; const el = document.getElementById("fq"); if (el) el.innerHTML = '<div class="loading"><div>Der Fragebogen konnte nicht geladen werden.<br><br><a class="btn" href="#/">Zurück</a></div></div>'; return; }
    if (location.hash.startsWith("#/fragen")) route();
  }
  function fqRefresh(q) {
    const el = document.getElementById("q_" + q.id);
    const ae = document.activeElement;
    if (el && !(ae && ae.tagName === "TEXTAREA" && el.contains(ae))) el.innerHTML = fqQ(q);   // Textfeld beim Tippen nicht neu aufbauen
    const all = fqAll(), n = fqCount(all);
    document.getElementById("fqN").textContent = `${n} von ${all.length} Fragen beantwortet`;
    document.getElementById("fqBar").style.width = Math.round(n / all.length * 100) + "%";
    FQ.sections.forEach((s, si) => { const e = document.getElementById("fqS" + si); if (e) e.textContent = `${fqCount(s.qs)}/${s.qs.length}`; });
  }
  function bindFragen() {
    const box = document.getElementById("fq");
    if (!box || !sb) return;
    if (!FQ) { loadFragen(); return; }
    const byQ = Object.fromEntries(fqAll().map(q => [q.id, q]));
    box.onclick = async e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "fqSend") {
        fragen.sent = Date.now(); save("fragen", fragen);
        ereignis("fragebogen", "Deine Herrin hat den Fragebogen abgeschickt");
        fqMsg("Wird gesendet …");
        const ok = navigator.onLine && await pushNow();
        fqMsg(ok ? "Gesendet ✓" : "Offline – wird später übertragen");
        document.getElementById("fqEnd").innerHTML = fqEnd();
        return;
      }
      const q = byQ[b.dataset.q];
      if (!q) return;
      if (document.activeElement && document.activeElement.tagName === "TEXTAREA") document.activeElement.blur();   // Safari fokussiert Knöpfe nicht
      const o = q.opts[+b.dataset.i], v = fqV(q.id);
      if (q.type === "einfach" || q.type === "mehrfach") {
        const sel = (Array.isArray(v) ? v : v ? [v] : []).slice(), at = sel.indexOf(o);
        if (at >= 0) sel.splice(at, 1);
        else if (q.max && sel.length >= q.max) { b.closest(".q").querySelector(".hint").textContent = `Höchstens ${q.max} – erst eine abwählen.`; return; }
        else sel.push(o);
        fqSet(q.id, sel);
      } else if (q.type === "skala") {
        const m = Object.assign({}, v || {}), k = +b.dataset.k;
        if (m[o] === k) delete m[o]; else m[o] = k;
        fqSet(q.id, m);
      }
      fqRefresh(q);
    };
    box.onchange = e => {
      const r = e.target;
      if (r.type !== "range") return;
      const q = byQ[r.dataset.rq], m = Object.assign({}, fqV(q.id + "_r") || {});
      m[q.opts[+r.dataset.i]] = +r.value;
      fqSet(q.id + "_r", m);
      r.classList.remove("unset");
    };
    box.oninput = e => {
      if (e.target.type === "range") { e.target.classList.remove("unset"); e.target.nextElementSibling.textContent = e.target.value; return; }
      const t = e.target.closest("textarea");
      if (!t) return;
      fqMsg("…");
      clearTimeout(fqT);
      fqT = setTimeout(() => { fqSet(t.dataset.t, t.value); fqRefresh(byQ[t.dataset.t.replace(/_text$/, "")] || { id: "" }); }, 700);
    };
    box.querySelectorAll("textarea").forEach(t => { t.onblur = () => { if (fqT) { clearTimeout(fqT); fqT = 0; if (t.value !== (fqV(t.dataset.t) || "")) fqSet(t.dataset.t, t.value); } }; });
    box.querySelectorAll("details").forEach(d => { d.ontoggle = () => { if (d.open) { prefs.fqOpen = +d.dataset.s; save("prefs", prefs); } }; });
  }

  /* ---------- Brief „Für meine Herrin“: Inhalt privat bei Supabase (brief.json), Abfragen mitten im Brief ---------- */
  let BR = null, BRA = null, brT = 0, NBR = null;
  const BKEY = BC.key || "brief", BB = () => (BKEY === "neuig" ? neuig : brief);     // welcher Text gerade aktiv ist
  /* Ausgaben (seit 27.10.2026): „Ausgabe: N“ im Kopf von Neuigkeiten_Herrin.md → BC.ausgabe; abgeschickt/geöffnet gelten je Ausgabe */
  const AUSG = BC.ausgabe || 1;
  const brSent = () => (BB().sentAusgabe || 1) === AUSG ? BB().sent : 0;
  const brGel = () => (BB().gelesenAusgabe || 1) === AUSG ? BB().gelesen : 0;
  const brV = id => (BB().a[id] || {}).v;
  function brSet(id, v) { BB().a[id] = { v, t: Date.now() }; save(BKEY, BB()); const m = document.getElementById("brSave"); if (m) m.textContent = "Gespeichert ✓"; }
  function brItems(doc) { doc = doc || BR; return doc ? doc.parts.filter(p => p.type === "q").flatMap(p => p.items) : []; }
  function brQ(f) {
    const v = brV(f.id);
    if (f.type === "regler") return `<h5>${f.hint ? `<small>${esc(f.hint)}</small>` : ""}</h5><div class="rgl"><small>1</small><input type="range" min="1" max="10" step="1" value="${v || 5}" class="${v ? "" : "unset"}" data-br="${f.id}" aria-label="Regler 1 bis 10"><small>10</small><b>${v || "–"}</b></div>`;
    let h = `<h5>${esc(f.q)}${f.type === "mehrfach" ? " <small>(mehrere möglich)</small>" : ""}</h5>`;
    if (f.type === "text") return h + `<textarea data-bt="${f.id}" maxlength="8000" placeholder="(optional)">${esc(v || "")}</textarea>`;
    const sel = Array.isArray(v) ? v : v ? [v] : [];
    return h + `<div class="opts">${f.opts.map((o, i) => `<button type="button" data-bq="${f.id}" data-i="${i}" class="${sel.includes(o) ? "on" : ""}">${esc(o)}</button>`).join("")}</div>`;
  }
  function brEnd() {
    return brSent() ? `<div class="fqdank">Danke, Herrin.</div><p>Abgeschickt am ${new Date(brSent()).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}. Du kannst alles jederzeit ändern – es speichert sich von selbst.</p><button type="button" class="btn" id="brSend">Erneut abschicken</button>`
      : `<button type="button" class="btn" id="brSend">Abschicken</button>`;
  }
  function viewBrief() {
    let h = header() + '<div class="wrap fq brief" id="br">';
    if (!sb) return h + '<div class="empty">Nur in der angemeldeten App.</div></div>';
    if (!BR) return h + '<div class="loading">Wird geöffnet …</div></div>';
    h += `<div class="paper"><h2>${esc(BR.title)}</h2>${BR.parts.map(p => p.type === "p" ? `<p>${p.html || esc(p.text)}</p>`

  let vipNeig = null;

  /* ---------- Glossar: erstes Vorkommen je Kapitel dezent markiert, Tipp zeigt eine Notizkarte ---------- */
  let glossSt = null;
  function glossClose() { document.querySelectorAll(".glk").forEach(k => k.remove()); }
  function glossMark(st) {
    if (st !== undefined) glossSt = st;
    const txt = document.querySelector("#reader .txt");
    glossClose();
    if (!txt) return;
    txt.querySelectorAll("span.gl").forEach(sp => sp.replaceWith(document.createTextNode(sp.textContent)));
    txt.normalize();
    const gl = glossSt && glossSt.glossar;
    if (!gl || prefs.glossar === false) return;
    const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const W = "A-Za-zÄÖÜäöüßÀ-ÿ";
    gl.forEach((g, i) => {
      const re = new RegExp(`(^|[^${W}])(${g.v.slice().sort((a, b) => b.length - a.length).map(rx).join("|")})(?![${W}])`);
      const tw = document.createTreeWalker(txt, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = tw.nextNode())) {
        if (n.parentNode.closest(".gl, .mh")) continue;
        const m = re.exec(n.nodeValue);
        if (!m) continue;
        const start = m.index + m[1].length, rest = n.splitText(start);
        rest.splitText(m[2].length);
        const sp = document.createElement("span");
        sp.className = "gl"; sp.dataset.g = i; sp.textContent = rest.nodeValue;
        rest.replaceWith(sp);
        break;
      }
    });
    txt.onclick = e => {
      const sp = e.target.closest(".gl");
      const offen = document.querySelector(".glk");
      glossClose();
      if (!sp || (offen && offen.dataset.g === sp.dataset.g)) return;
      e.stopPropagation();
      const g = glossSt.glossar[+sp.dataset.g], k = document.createElement("div");
      k.className = "glk"; k.dataset.g = sp.dataset.g;
      k.innerHTML = `<b>${esc(g.b)}</b>${esc(g.e)}`;
      document.body.appendChild(k);
      const r = sp.getBoundingClientRect(), w = k.offsetWidth;
      k.style.left = Math.max(16, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 16)) + "px";
      const unten = r.bottom + 8 + k.offsetHeight < innerHeight;
      k.style.top = (unten ? r.bottom + 8 : Math.max(8, r.top - 8 - k.offsetHeight)) + "px";
    };
  }
  document.addEventListener("click", e => { if (!e.target.closest(".gl, .glk")) glossClose(); });
  addEventListener("scroll", () => { if (document.querySelector(".glk")) glossClose(); }, { passive: true, capture: true });

  function closeSheet() { document.getElementById("sheet").classList.remove("open"); const k = document.getElementById("kdr"); if (k) k.classList.remove("open"); document.getElementById("sheetBg").style.display = "none"; }
  document.getElementById("sheetBg").onclick = closeSheet;

  /* ---------- Router ---------- */
  /* ---------- Scrollen (Fenster oder – im gedrehten Querformat – #app) ---------- */
  const root = document.documentElement;
  const turned = () => root.classList.contains("turned");
  const getY = () => turned() ? app.scrollTop : window.scrollY;
  const getMax = () => turned() ? app.scrollHeight - app.clientHeight : document.documentElement.scrollHeight - innerHeight;
  const setY = y => { if (turned()) app.scrollTop = y; else window.scrollTo(0, y); };
  function orient() {
    const W = innerWidth, H = innerHeight;
    const coarse = matchMedia("(pointer: coarse)").matches;
    const land = coarse && W > H && H <= 540;
    let ang = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
    ang = ((ang % 360) + 360) % 360;
    const was = turned(), max0 = getMax(), ratio = max0 > 0 ? getY() / max0 : 0;
    root.classList.toggle("turned", land);
    root.classList.toggle("t-left", land && ang !== 270);
    root.classList.toggle("t-right", land && ang === 270);
    if (land) { root.style.setProperty("--tw", H + "px"); root.style.setProperty("--th", W + "px"); }
    if (was !== land) requestAnimationFrame(() => { setY(ratio * getMax()); if (onScroll) onScroll(); });
  }
  let onScroll = null;
  let lastRoute = "", taps = [], sleepT = 0;
  function route() {
    vipZu();
    kfbFlush();
    closeSheet();
    clearInterval(sleepT);
    const fresh = location.hash !== lastRoute;   // echter Seitenwechsel (kein Neuaufbau)
    lastRoute = location.hash;
    if (onScroll) { window.removeEventListener("scroll", onScroll); app.removeEventListener("scroll", onScroll); onScroll = null; }

    const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
    if (parts[0] === "read" && kapZu(byId[parts[1]], Math.max(0, parseInt(parts[2] || "0", 10) || 0))) { location.replace("#/story/" + parts[1]); return; }   // gesperrtes Kapitel
    const reading = parts[0] === "read";
    document.body.classList.toggle("reading", reading);
    document.body.classList.toggle("showp", !!prefs.showP);
    const tab = parts[0] === "bibliothek" ? "lib" : parts[0] === "gelesen" ? "done" : parts[0] === "erfolge" ? "ach" : parts[0] === "einstellungen" ? "set" : parts[0] === "gutscheine" ? "gs" : "home";
    document.querySelectorAll(".tabbar a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab && !reading && parts[0] !== "story"));
    let html;
    if (parts[0] === "bibliothek") html = viewLibrary();
    else if (parts[0] === "gelesen") html = viewDone();
    else if (parts[0] === "erfolge") html = viewAch();
    else if (parts[0] === "story") html = viewStory(parts[1]);
    else if (parts[0] === "fragen") html = viewFragen();
    else if (parts[0] === "reihe") html = viewReihe(parts[1]);
    else if (parts[0] === "brief") html = viewBrief();

    else if (parts[0] === "feedbackantworten") html = viewFeedbackAntw();
    else if (parts[0] === "neuigkeiten") html = viewNeuigkeiten();
    else if (parts[0] === "advent") html = viewAdvent();
    else if (parts[0] === "gutscheine") html = viewGutscheine();
    else if (parts[0] === "einstellungen") html = viewEinstellungen();
    else if (parts[0] === "kapitelfeedbackantworten") html = viewKfbAntw(parts[1] ? [parts[1], parts[2]] : null);

    effekt(!reading && parts[0] === "");

    const ss = document.getElementById("sortSel"), fs = document.getElementById("filterSel");

    if (fs) fs.onchange = () => { prefs.filter = fs.value; save("prefs", prefs); route(); };
    const qi = document.getElementById("q");

      query = qi.value; secretWord(query);
      clearTimeout(qT);
      qT = setTimeout(() => { const y = getY(); route(); setY(y); const n = document.getElementById("q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 400);
    };
    document.querySelectorAll(".brand").forEach(b => { b.onclick = () => {
      const now = Date.now(); taps = taps.filter(t => now - t < 3000).concat(now);
      if (taps.length >= 7) grant("geh-klopfen");
    }; });
    if (parts[0] === "erfolge" && fresh && bump("achViews", dayKey(new Date()), 10)) grant("geh-neugier");
    const gs = document.getElementById("genreSel");
    if (gs) gs.onchange = () => { prefs.genre = gs.value; save("prefs", prefs); route(); };

    const more = document.getElementById("more");
    if (more) more.onclick = () => { document.getElementById("desc").classList.remove("clamp"); more.remove(); };
    document.querySelectorAll(".acard").forEach(b => { b.onclick = () => openAch(b.dataset.a); });
    const df = document.getElementById("doneFold");
    if (df) df.ontoggle = () => { prefs.doneOpen = df.open; save("prefs", prefs); };
    const af = document.getElementById("arcFold");
    if (af) af.ontoggle = () => { prefs.arcOpen = af.open; save("prefs", prefs); };
    const on = (elId, fn) => { const el = document.getElementById(elId); if (el) el.onclick = fn; };

        clearTimeout(t);
        t = setTimeout(() => {

      window.addEventListener("scroll", onScroll, { passive: true });

      requestAnimationFrame(() => {
        setY(restore * getMax());
        onScroll();

    } else {
      setY(0);
    }
  }
  window.addEventListener("hashchange", route);

  /* ---------- Altersabfrage ---------- */
  function gate() {
    if (sb) { evFlush(); setTimeout(nbZahl, 1200); setTimeout(gsPruefen, 2500); setTimeout(pushAbgleich, 3500); }     // Ereignis-Warteschlange senden, Neuigkeiten-Zähler (Markus)

  }
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch (e) {}
  orient();
  window.addEventListener("resize", orient);
  window.addEventListener("orientationchange", () => setTimeout(orient, 60));

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { logOpen(); if (document.body.classList.contains("reading")) { const r = lastRoute; setTimeout(() => { if (location.hash === r) timeEvents(false); }, 0); } } });

})();
